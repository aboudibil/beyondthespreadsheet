backend:
  name: git-gateway
  branch: main

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "tools"
    label: "Tools (the commons)"
    files:
      - name: "tools"
        label: "Tools list"
        file: "assets/data/tools.json"
        fields:
          - label: "Tools"
            name: "tools"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "The public question it answers", name: "question", widget: "string"}
              - {label: "Theory (named, published)", name: "theory", widget: "string", required: false}
              - {label: "Status", name: "status", widget: "select", options: ["live","next","planned"], default: "planned"}
              - {label: "Tags (comma-separated)", name: "tags", widget: "string", required: false}
              - {label: "Contributor", name: "contributor", widget: "string", required: false}
              - {label: "Open URL", name: "open", widget: "string", required: false}
              - {label: "Download URL", name: "download", widget: "string", required: false}
              - {label: "Docs URL", name: "docs", widget: "string", required: false}
  - name: "settings"
    label: "Site settings"
    files:
      - name: "links"
        label: "Links"
        file: "assets/data/settings.json"
        fields:
          - {label: "LinkedIn newsletter URL (Subscribe button)", name: "newsletter", widget: "string", required: false}
          - {label: "Contribute form endpoint (Formspree)", name: "contribute", widget: "string", required: false}
  - name: "pocs"
    label: "Proofs of concept (gallery)"
    files:
      - name: "pocs"
        label: "Proof-of-concept list"
        file: "assets/data/pocs.json"
        fields:
          - label: "Proofs of concept"
            name: "pocs"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "The policy question it explores", name: "question", widget: "string"}
              - {label: "Policy domain", name: "domain", widget: "string", required: false}
              - {label: "Pattern (e.g. trap, AND-gate, sequencing)", name: "pattern", widget: "string", required: false}
              - {label: "Approach (one line)", name: "approach", widget: "string", required: false}
              - {label: "Theory (named, published)", name: "theory", widget: "string", required: false}
              - {label: "PoC document URL (to read online)", name: "document", widget: "string", required: false}
              - {label: "Download URL", name: "download", widget: "string", required: false}
              - {label: "Show on site", name: "published", widget: "boolean", default: false}
